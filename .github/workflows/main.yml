name: Build DS Game (Android APK)

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Android 10-14 arm64+arm32)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check package name consistency
      run: |
        set -e
        grep -q 'package="com.cb4"' game/AndroidManifest.xml
        grep -q 'android:name="com.cb4.GameActivity"' game/AndroidManifest.xml
        grep -q '^package com.cb4;' game/java/com/dimscript/gamedemo/GameActivity.java
        grep -q 'Java_com_cb4_GameActivity_nativeReplaceText' runtime.c
        grep -q 'Java_com_cb4_GameActivity_nativeSubmitText' runtime.c
        grep -q 'Java_com_cb4_GameActivity_nativeKeyboardHidden' runtime.c
        ! grep -rn 'dimscript\.gamedemo\|Java_com_dimscript\|com\.CB4\|Java_com_CB4' \
          game/AndroidManifest.xml game/java runtime.c

    - uses: android-actions/setup-android@v3
    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate game.c
      run: |
        python3 gen.py

    - name: Stage assets
      run: |
        python3 stage_assets.py game/assets staging/assets

    - name: Build NDK (arm64-v8a + armeabi-v7a, min API 29 Android 10)
      run: |
        NDK_ROOT=$ANDROID_NDK_ROOT
        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        GLUE="$NDK_ROOT/sources/android/native_app_glue"

        mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/assets

        "$TOOLCHAIN/aarch64-linux-android29-clang" -O3 -s -fPIC -shared \
          game/game.c runtime.c main.c $GLUE/android_native_app_glue.c \
          -I. -I$GLUE -landroid -llog -lm \
          -o staging/lib/arm64-v8a/libds_game.so

        "$TOOLCHAIN/armv7a-linux-androideabi29-clang" -O3 -s -fPIC -shared \
          game/game.c runtime.c main.c $GLUE/android_native_app_glue.c \
          -I. -I$GLUE -landroid -llog -lm \
          -o staging/lib/armeabi-v7a/libds_game.so

    - name: Package APK (Android 10 to 14, target API 34)
      run: |
        SDK_ROOT=$ANDROID_HOME
        BT="$SDK_ROOT/build-tools/34.0.0"

        "$BT/aapt" package -f -M game/AndroidManifest.xml \
          -I "$SDK_ROOT/platforms/android-34/android.jar" \
          -F unsigned.apk ./staging/

        "$BT/zipalign" -v 4 unsigned.apk aligned.apk
        keytool -genkey -v -keystore debug.keystore -storepass android \
          -alias debug -keypass android -keyalg RSA -keysize 2048 \
          -validity 10000 -dname "CN=Debug" 2>/dev/null || true
        "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
          --out Game.apk aligned.apk

    - uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Android10-14-arm64-arm32
        path: Game.apk
