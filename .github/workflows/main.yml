name: Build DS Game

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - uses: android-actions/setup-android@v3
    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Build DS compiler
      run: |
        gcc -O3 ds_compiler.c -o ds_compiler

    - name: Compile game.ds to C
      run: |
        ./ds_compiler game.ds game.c

    - name: Build for Android
      run: |
        NDK_ROOT=$ANDROID_NDK_ROOT
        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        GLUE="$NDK_ROOT/sources/android/native_app_glue"
        
        mkdir -p staging/lib/arm64-v8a staging/assets
        
        "$TOOLCHAIN/aarch64-linux-android21-clang" -O3 -s -fPIC -shared \
          game.c runtime.c main.c $GLUE/android_native_app_glue.c \
          -I. -I$GLUE -landroid -llog -lm \
          -o staging/lib/arm64-v8a/libds_game.so

    - name: Package APK
      run: |
        SDK_ROOT=$ANDROID_HOME
        BT="$SDK_ROOT/build-tools/34.0.0"
        
        "$BT/aapt" package -f -M ./AndroidManifest.xml \
          -I "$SDK_ROOT/platforms/android-34/android.jar" \
          -F unsigned.apk ./staging/
        
        "$BT/zipalign" -v 4 unsigned.apk aligned.apk
        
        keytool -genkey -v -keystore debug.keystore -storepass android \
          -alias debug -keypass android -keyalg RSA -keysize 2048 \
          -validity 10000 -dname "CN=Debug" 2>/dev/null || true
        
        "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
          --out Game.apk aligned.apk

    - uses: actions/upload-artifact@v4
      with:
        name: Game-APK
        path: Game.apk
