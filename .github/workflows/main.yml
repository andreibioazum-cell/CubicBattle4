name: Build DS Game (Android APK & Windows PC .exe)

on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Android 10-14 arm64+arm32)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Меняем пакет на com.CB4 во всех трёх местах: манифест, Java, JNI-имена в runtime.c.
    # Замена обязана затронуть runtime.c, иначе сломаются нативные вызовы клавиатуры/чата.
    - name: Rename package to com.CB4
      run: |
        sed -i 's/com\.dimscript\.gamedemo/com.CB4/g' \
          game/AndroidManifest.xml \
          game/java/com/dimscript/gamedemo/GameActivity.java \
          runtime.c

    - uses: android-actions/setup-android@v3
    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate game.c
      run: |
        python3 gen.py

    - name: Stage assets
      run: |
        python3 stage_assets.py game/assets staging/assets

    - name: Build NDK (arm64-v8a + armeabi-v7a, min API 29 Android 10)
      run: |
        NDK_ROOT=$ANDROID_NDK_ROOT
        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        GLUE="$NDK_ROOT/sources/android/native_app_glue"

        mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/assets

        # arm64-v8a — min API 29 (Android 10)
        "$TOOLCHAIN/aarch64-linux-android29-clang" -O3 -s -fPIC -shared \
          game/game.c runtime.c main.c $GLUE/android_native_app_glue.c \
          -I. -I$GLUE -landroid -llog -lm \
          -o staging/lib/arm64-v8a/libds_game.so

        # arm32 armeabi-v7a — min API 29
        "$TOOLCHAIN/armv7a-linux-androideabi29-clang" -O3 -s -fPIC -shared \
          game/game.c runtime.c main.c $GLUE/android_native_app_glue.c \
          -I. -I$GLUE -landroid -llog -lm \
          -o staging/lib/armeabi-v7a/libds_game.so

    - name: Package APK
      run: |
        SDK_ROOT=$ANDROID_HOME
        BT="$SDK_ROOT/build-tools/34.0.0"

        "$BT/aapt" package -f -M game/AndroidManifest.xml \
          -I "$SDK_ROOT/platforms/android-34/android.jar" \
          -F unsigned.apk ./staging/

        "$BT/zipalign" -v 4 unsigned.apk aligned.apk
        "$BT/apksigner" sign \
          --ks keystore.jks \
          --ks-key-alias ${{ secrets.KEY_ALIAS }} \
          --ks-pass pass:${{ secrets.KEY_STORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          --out Game.apk aligned.apk

    - uses: actions/upload-artifact@v4
      with:
        name: Game-APK-Android10-14-arm64-arm32
        path: Game.apk

  build-pc-cmake:
    name: Build Windows PC (.exe) with CMake
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Game.exe
      run: cmake --build build --config Release

    - name: Prepare Release ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path build/Release/Game.exe -DestinationPath Game-Windows-PC.zip

    - uses: actions/upload-artifact@v4
      with:
        name: Game-Windows-PC-Full-Package
        path: Game-Windows-PC.zip
